name: CivicPulse Architecture Branch Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: ["rebuild/architecture-foundation"]
  workflow_dispatch:

jobs:
  vision-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-vision-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-vision-service/requirements.txt
      - name: Install core vision-service requirements
        run: pip install -r requirements.txt
      - name: Run offline provider-router tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q app tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend-app
        run: npm ci
      - name: Build frontend
        working-directory: frontend-app
        run: npm run build
