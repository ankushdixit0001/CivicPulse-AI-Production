name: Validate CivicPulse architecture rebuild

on:
  push:
    branches:
      - "rebuild/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  vision-service:
    name: AI service tests and import smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-vision-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai-vision-service/requirements.txt

      - name: Install test dependencies (without downloading YOLO/Torch weights)
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.111.1 httpx==0.27.2 numpy==1.26.4 opencv-python-headless==4.10.0.84 pillow==10.4.0 python-multipart==0.0.9

      - name: Compile Python source
        run: python -m compileall -q app tests

      - name: Run provider unit tests
        run: python -m unittest discover -s tests -v

      - name: Import FastAPI application
        run: python -c "from app.main import app; print(app.title)"

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-app/package-lock.json

      - name: Verify frontend lockfile and install dependencies
        run: |
          test -f frontend-app/package-lock.json
          cd frontend-app
          npm ci

      - name: Build frontend
        run: |
          cd frontend-app
          npm run build

  edge-function:
    name: Supabase Edge Function type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2

      - name: Check Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/civicpulse-api/index.ts
