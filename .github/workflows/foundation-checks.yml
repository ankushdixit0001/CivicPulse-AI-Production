name: CivicPulse foundation checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend-app/**'
      - 'supabase/**'
      - 'docs/api/**'
      - '.github/workflows/foundation-checks.yml'
  push:
    branches: [feat/foundation-phase-5]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  sql-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration and policy assertions are present
        run: |
          test -s supabase/migrations/20261030120000_foundation_security_and_resolution.sql
          test -s supabase/tests/foundation_rls.test.sql
          grep -q 'enable row level security' supabase/migrations/20261030120000_foundation_security_and_resolution.sql || grep -q 'RLS' supabase/migrations/20261030120000_foundation_security_and_resolution.sql
          grep -q 'confirm_civic_issue_resolution' supabase/migrations/20261030120000_foundation_security_and_resolution.sql
