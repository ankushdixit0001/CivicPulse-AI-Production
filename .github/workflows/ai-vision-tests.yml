name: AI vision regression tests

on:
  push:
    paths:
      - "ai-vision-service/**"
      - ".github/workflows/ai-vision-tests.yml"
  pull_request:
    paths:
      - "ai-vision-service/**"
      - ".github/workflows/ai-vision-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-vision-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install fastapi==0.111.1 pillow==10.4.0 opencv-python-headless==4.10.0.84 numpy==1.26.4 python-multipart==0.0.9 httpx==0.27.2
      - name: Run AI vision regression tests
        run: python -m unittest discover -s tests -v
