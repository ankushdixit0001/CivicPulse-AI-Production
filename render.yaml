services:
  - type: web
    name: civicpulse-ai-vision
    runtime: docker
    plan: free
    dockerContext: ./ai-vision-service
    dockerfilePath: ./ai-vision-service/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Required internal secret. Use the same value as Supabase AI_SERVICE_TOKEN.
      - key: VISION_API_TOKEN
        sync: false
      # Best-effort, no-key provider for development/demo. Not a production SLA.
      - key: LLMFAUCET_ENABLED
        value: "true"
      - key: LLMFAUCET_MODEL
        value: auto:smart
      - key: AI_PROVIDER_ORDER
        value: "gemini,groq,openai,llmfaucet"
